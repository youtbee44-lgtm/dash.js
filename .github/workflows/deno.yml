name: xAI API Example

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  call-xai:
    runs-on: ubuntu-latest

    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Call xAI API
        run: |
          curl -sS https://api.x.ai/v1/chat/completions \
            -H "Authorization: Bearer $XAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "grok-2-latest",
              "messages": [
                {
                  "role": "user",
                  "content": "Merhaba, bu GitHub Actions örneğini test ediyorum."
                }
              ],
              "temperature": 0.7
            }'
